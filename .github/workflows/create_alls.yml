name: Run Python Script and Commit Outputs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run main.py
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Automated commit: results from main.py [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
